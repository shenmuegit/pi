name: RPC 12196 CI

on:
  push:
    branches: [ci/12196-baseline, ci/12196-fixed]

permissions:
  contents: read

concurrency:
  group: rpc-12196-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Previews are published for main, release tags and PRs from branches of this repo only (see preview-packages.yml).
      - name: Pack preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Pull request runs check out a merge commit; tarballs are keyed by the PR head commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/preview-packages.mjs pack --sha "$SHA" --out "$RUNNER_TEMP/preview-packages"

      - name: Upload preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-packages
          path: ${{ runner.temp }}/preview-packages
          retention-days: 3
          if-no-files-found: error

      - name: Check
        run: npm run check

      # The checkout has no tags; the released changelog sections are compared with the newest release tag.
      - name: Fetch the newest release tag
        run: |
          tag=$(git ls-remote --tags --sort=-v:refname origin 'v*.*.*' | grep -v '\^{}' | head -1 | sed 's#.*refs/tags/##')
          git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"

      - name: Check released changelog sections
        run: npm run check:released-changelogs

  # Tests are split across parallel jobs so the slowest suites do not run back to back.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coding-agent
          - name: durable
          - name: chord
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies
        if: matrix.name != 'durable' && matrix.name != 'chord'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Build the pi-env daemon
        if: matrix.name == 'other'
        run: npm run build:daemon --workspace packages/env

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
        run: |
          if [ "$SUITE" != other ]; then
            npm run test --workspace "packages/$SUITE"
            exit 0
          fi
          # Every other workspace, so new packages are tested without editing this workflow.
          args=()
          for dir in packages/*/; do
            case "$dir" in packages/coding-agent/ | packages/durable/ | packages/chord/) continue ;; esac
            args+=(--workspace "${dir%/}")
          done
          npm run test:scripts
          npm run test --if-present "${args[@]}"

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance

  regression:
    name: regression (${{ matrix.variant }})
    if: github.ref_name == 'ci/12196-fixed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: 8209929fb553e7a8c91dc0894569f9ec43dd201f
            expected_failures: 6
          - variant: fixed
            ref: 076f2c70ea95bc267316e7f022eb64eef9351398
            expected_failures: 0
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Checkout regression test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 076f2c70ea95bc267316e7f022eb64eef9351398
          path: regression-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: packages/coding-agent/test/suite/regressions/12196-deferred-rpc-prompt.test.ts

      - name: Copy regression test
        run: cp regression-source/packages/coding-agent/test/suite/regressions/12196-deferred-rpc-prompt.test.ts packages/coding-agent/test/suite/regressions/12196-deferred-rpc-prompt.test.ts

      - name: Run regression
        id: regression
        working-directory: packages/coding-agent
        run: |
          set +e
          node ../../node_modules/vitest/dist/cli.js --run test/suite/regressions/12196-deferred-rpc-prompt.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/rpc-12196-regression.json"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Verify regression outcome
        env:
          EXPECTED_FAILURES: ${{ matrix.expected_failures }}
          EXIT_CODE: ${{ steps.regression.outputs.exit_code }}
        run: |
          if [ "$EXPECTED_FAILURES" -eq 0 ]; then
            test "$EXIT_CODE" -eq 0
          else
            test "$EXIT_CODE" -eq 1
          fi
          jq -e --argjson failures "$EXPECTED_FAILURES" \
            '.numTotalTests == 11 and .numFailedTests == $failures and .numPassedTests == (11 - $failures)' \
            "$RUNNER_TEMP/rpc-12196-regression.json"
          jq '{numTotalTests, numPassedTests, numFailedTests}' "$RUNNER_TEMP/rpc-12196-regression.json"

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rpc-12196-regression-${{ matrix.variant }}
          path: ${{ runner.temp }}/rpc-12196-regression.json
          retention-days: 3
          if-no-files-found: error
