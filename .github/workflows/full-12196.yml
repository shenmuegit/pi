name: RPC 12196 full test

on:
  push:
    branches: [ci/12196-full]

permissions:
  contents: read

concurrency:
  group: rpc-12196-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test:
    name: full test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: 8209929fb553e7a8c91dc0894569f9ec43dd201f
          - variant: fixed
            ref: 076f2c70ea95bc267316e7f022eb64eef9351398
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      - name: Check
        run: npm run check

      - name: Verify temporary directory layout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/t"
          sed 's|npm test$|node ../../node_modules/vitest/dist/cli.js --run test/output-file-failures.test.ts test/resource-loader.test.ts|' test.sh > .ci-layout-smoke.sh
          grep -Fq 'vitest/dist/cli.js' .ci-layout-smoke.sh
          (cd packages/coding-agent && TMPDIR="$GITHUB_WORKSPACE/t" bash ../../.ci-layout-smoke.sh)
          sed 's|npm test$|node ../../node_modules/vitest/dist/cli.js --run test/conformance.test.ts|' test.sh > .ci-layout-smoke.sh
          (cd packages/env && TMPDIR="$GITHUB_WORKSPACE/t" bash ../../.ci-layout-smoke.sh)
          rm -- .ci-layout-smoke.sh

      - name: Full test script
        run: |
          TMPDIR="$GITHUB_WORKSPACE/t" ./test.sh

