name: RPC 12196 full test

on:
  push:
    branches: [ci/12196-full]

permissions:
  contents: read

concurrency:
  group: rpc-12196-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test:
    name: full test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: 8209929fb553e7a8c91dc0894569f9ec43dd201f
          - variant: fixed
            ref: 076f2c70ea95bc267316e7f022eb64eef9351398
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      - name: Check
        run: npm run check

      - name: Full test script
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.test-runtime/tmp"
          TMPDIR="$GITHUB_WORKSPACE/.test-runtime/tmp" ./test.sh

