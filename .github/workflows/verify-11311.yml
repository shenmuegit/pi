name: Verify MCP OAuth cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'shenmuegit/pi'
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, patched]
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          sparse-checkout: .github/ci/11311
          persist-credentials: false

      - name: Checkout fixed upstream baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: earendil-works/pi
          ref: bdb151774ed6bef2b5676bbff4669f20a0c233fe
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Prepare source and project-local state
        env:
          PI_VERIFY_VARIANT: ${{ matrix.variant }}
        run: bash ../harness/.github/ci/11311/verify.sh prepare

      - name: Install system dependencies
        run: bash ../harness/.github/ci/11311/verify.sh system

      - name: Install dependencies without lifecycle scripts
        id: install
        run: bash ../harness/.github/ci/11311/verify.sh install

      - name: Build with current generated model data
        id: build
        run: bash ../harness/.github/ci/11311/verify.sh build

      - name: Original npm run check
        id: check
        run: bash ../harness/.github/ci/11311/verify.sh check

      - name: Build execution daemon
        id: daemon
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash ../harness/.github/ci/11311/verify.sh daemon

      - name: Original isolated ./test.sh
        id: tests
        if: ${{ !cancelled() && steps.daemon.outcome == 'success' }}
        run: bash ../harness/.github/ci/11311/verify.sh tests

      - name: MCP conformance against committed baseline
        id: conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash ../harness/.github/ci/11311/verify.sh conformance

      - name: Verify command outcomes and summarize
        if: ${{ always() }}
        env:
          VERIFY_CHECK: ${{ steps.check.outcome }}
          VERIFY_TESTS: ${{ steps.tests.outcome }}
          VERIFY_CONFORMANCE: ${{ steps.conformance.outcome }}
        run: bash ../harness/.github/ci/11311/verify.sh summary

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oauth-11311-${{ matrix.variant }}
          path: .validation/11311/logs
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
